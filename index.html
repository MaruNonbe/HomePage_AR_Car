<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Car Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        /* ページ全体にモデルを表示するためのスタイル */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: #f0f0f0; /* 背景色 */
        }
    </style>
</head>
<body>
    <model-viewer
        src="Car.glb"
        ios-src="Car.usdz"
        alt="A 3D model of a car"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        shadow-intensity="1">
    </model-viewer>
</body>
</html>
